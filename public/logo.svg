<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- ATM Icon -->
  <g fill="none" stroke="#0D2B52" stroke-width="10">
    <rect x="80" y="40" width="140" height="220" rx="20" ry="20"/>
    <rect x="100" y="70" width="100" height="50" fill="#0D2B52"/>
    <rect x="110" y="140" width="80" height="40" stroke="#0D2B52"/>
    <rect x="110" y="200" width="20" height="20" fill="#0D2B52"/>
    <rect x="140" y="200" width="20" height="20" fill="#0D2B52"/>
    <rect x="170" y="200" width="20" height="20" fill="#0D2B52"/>
  </g>

  <!-- Money slot -->
  <rect x="110" y="75" width="80" height="40" fill="white"/>
  <text x="150" y="100" font-size="20" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#0D2B52">$</text>

  <!-- Text -->
  <text x="150" y="290" font-size="28" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#0D2B52">GAV</text>
  <text x="150" y="320" font-size="14" font-family="Arial" text-anchor="middle" fill="#0D2B52">GUICHET AUTOMATIQUE VIRTUEL</text>
</svg>
